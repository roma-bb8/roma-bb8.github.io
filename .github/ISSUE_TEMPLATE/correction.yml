name: Correction
description: A typo, a broken link, or a wrong fact on the site
labels: ["documentation"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is wrong, and on which page?
      description: Quote the text or give the link.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
    validations:
      required: false
