<!doctype html>
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Сайт переїхав · The site has moved</title>
		<link rel="canonical" href="https://www.baranenko.capital/" />
		<script>
			// Keep the path, the query and the hash: /blog/hello/ goes to https://www.baranenko.capital/blog/hello/
			location.replace(
				'https://www.baranenko.capital' + location.pathname + location.search + location.hash,
			);
		</script>
		<noscript>
			<meta http-equiv="refresh" content="0; url=https://www.baranenko.capital/" />
		</noscript>
	</head>
	<body>
		<p>
			Сайт переїхав на <a href="https://www.baranenko.capital/">www.baranenko.capital</a>.<br />

		</p>
	</body>
</html>
